<article class="post-card">
  <a class="post-image-link" href="{{ .RelPermalink }}" aria-label="Ανάγνωση του άρθρου: {{ .Title }}">
    {{ with .Params.image }}
      <img class="post-image" src="{{ . | relURL }}" alt="" loading="lazy" decoding="async">
    {{ else }}
      <div class="post-image post-image-placeholder" aria-hidden="true"><span>Χωρίς εικόνα</span></div>
    {{ end }}
  </a>
  <div class="post-card-body">
    <div class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02/01/2006" }}</time></div>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p>{{ .Description | default (.Summary | plainify) }}</p>
    <a class="text-link" href="{{ .RelPermalink }}">Διαβάστε το άρθρο <span aria-hidden="true">→</span></a>
  </div>
</article>
