# Put this server block in /etc/nginx/sites-available/weather-blog
# Replace example.com with your real domain.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/weather-blog/public;
    index index.html;

    # ACME challenge path for Certbot/Let's Encrypt.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        allow all;
    }

    # Static website: no application server and no writable directory here.
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    }

    location ~ /\. {
        deny all;
    }
}
